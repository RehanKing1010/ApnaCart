<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonBlade</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #080a10;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        img {
            display: block;
            max-width: 90%;
            margin: 30px auto;
            border-radius: 16px;
        }

        .icon {
            width: 180px;
        }

            width: 600px;
        }

<body>

    <h1>NeonBlade</h1>

    <h2>App Icon</h2>
    <img class="icon" src="app_icon.png" alt="NeonBlade App Icon">

    <h2>Screenshot 1</h2>
    <img class="screenshot" src="screenshot-1.jpeg" alt="NeonBlade Screenshot 1">

    <h2>Screenshot 2</h2>
    <img class="screenshot" src="screenshot-2.jpeg" alt="NeonBlade Screenshot 2">

    <h2>Screenshot 3</h2>
    <img class="screenshot" src="screenshot-3.jpeg" alt="NeonBlade Screenshot 3">

</body>
</html>
